<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="glass-card">
        <h1>URL を入力してください</h1>
        <p class="subtitle">お好きな URL を入力して、送信ボタンで次の処理に進めます。</p>
        <form id="url-form">
            <div class="input-group">
                <label for="user-url">URL</label>
                <div class="input-row">
                    <input id="user-url" name="user-url" type="url" placeholder="https://example.com" required>
                    <button type="submit">送信</button>
                </div>
            </div>
        </form>
    </div>
</body>
</html>
